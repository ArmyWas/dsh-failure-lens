name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: npm trusted publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released commit
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release tag and package version
        shell: bash
        run: |
          package_version="$(node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; process.stdout.write(pkg.version)")"
          release_version="${GITHUB_REF_NAME#v}"
          test "$package_version" = "$release_version"

      - name: Install release dependencies
        run: npm ci --ignore-scripts

      - name: Run release gates
        run: npm run check

      - name: Pack the exact release artifact
        id: artifact
        shell: bash
        run: |
          release_dir="$RUNNER_TEMP/dsh-failure-lens-release"
          package_version="$(node -p "require('./package.json').version")"
          tarball_name="dsh-failure-lens-${package_version}.tgz"
          mkdir -p "$release_dir"
          npm pack --pack-destination "$release_dir"
          test -f "$release_dir/$tarball_name"
          (cd "$release_dir" && sha256sum "$tarball_name" > "$tarball_name.sha256")
          echo "tarball=$release_dir/$tarball_name" >> "$GITHUB_OUTPUT"
          echo "checksum=$release_dir/$tarball_name.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload the exact npm input to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          "${{ steps.artifact.outputs.tarball }}"
          "${{ steps.artifact.outputs.checksum }}"
          --clobber

      - name: Publish the exact artifact with npm provenance
        env:
          NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: >-
          npm publish "${{ steps.artifact.outputs.tarball }}"
          --access public --tag "$NPM_DIST_TAG"
