name: Upstream canary

on:
  schedule:
    - cron: '31 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-client-contract:
    name: current release manifest / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install the package manager required by dsh plugin
        run: npm install --global pnpm@11.19.0
      - run: npm ci
      - name: Resolve one coherent Harness release manifest
        shell: pwsh
        run: |
          $releaseVersion = (npm view '@deepseek-ai/dsh@next' version).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $releaseVersion) { throw 'could not resolve @deepseek-ai/dsh@next' }
          $names = @(
            '@deepseek-ai/dsh-client-locale'
            '@deepseek-ai/dsh-client-ui-chat'
            '@deepseek-ai/dsh-client-ui-conversation'
            '@deepseek-ai/dsh-client-ui-primitives'
            '@deepseek-ai/dsh-client-ui-renderer'
            '@deepseek-ai/dsh-client-ui-slots'
            '@deepseek-ai/dsh-session'
            '@deepseek-ai/dsh-app-boot'
          )
          $packages = @($names | ForEach-Object { "$_@$releaseVersion" })
          $packages += "@deepseek-ai/dsh@$releaseVersion"
          "HARNESS_RELEASE_VERSION=$releaseVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          "## Coherent DeepSeek Harness client release" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Every Harness package below is pinned to the version selected by ``@deepseek-ai/dsh@next``: ``$releaseVersion``." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $names | ForEach-Object { "- ``$_@$releaseVersion``" } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          npm install --ignore-scripts --no-audit --no-fund --no-save --package-lock=false @packages
          $installExit = $LASTEXITCODE
          if ($installExit -ne 0) {
            Write-Host "::error title=Harness current release manifest is not installable::The packages pinned to $releaseVersion could not be resolved together."
            exit $installExit
          }
      - run: npm run check
      - name: Initialize the official current profile and validate the packed bundle
        shell: pwsh
        run: |
          $env:DSH_HOME = Join-Path $env:RUNNER_TEMP 'dsh-failure-lens-canary'
          node scripts/init-upstream-profile.mjs
          if ($LASTEXITCODE -ne 0) { throw 'app-boot could not initialize the current web profile' }

          $packRoot = Join-Path $env:RUNNER_TEMP 'dsh-failure-lens-pack'
          New-Item -ItemType Directory -Force -Path $packRoot | Out-Null
          $pack = npm pack --json --pack-destination $packRoot | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $pack.filename) { throw 'npm pack did not produce an artifact' }
          $tarball = Join-Path $packRoot $pack.filename

          $paths = @($pack.files | ForEach-Object path)
          foreach ($required in @('package.json', 'cordis.patch.yml', 'lib/index.js', 'lib/client.js')) {
            if ($paths -notcontains $required) { throw "packed bundle is missing $required" }
          }

          $manifest = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          if ($manifest.dsh.bundle.patch -ne './cordis.patch.yml') { throw 'unexpected dsh.bundle.patch contract' }
          if ($manifest.dsh.client.platform -ne 'web') { throw 'unexpected dsh.client.platform contract' }

          node node_modules/@deepseek-ai/dsh/lib/bin.js plugin --profile web add $tarball
          if ($LASTEXITCODE -ne 0) { throw 'the current dsh CLI could not install the packed plugin' }

          $config = node node_modules/@deepseek-ai/dsh/lib/bin.js --profile web --dump-config
          if ($LASTEXITCODE -ne 0) { throw 'the installed profile could not compose its config' }
          if (($config -join "`n") -notmatch 'dsh-failure-lens') { throw 'the composed profile is missing dsh-failure-lens' }

          node scripts/smoke-web-profile.mjs
          if ($LASTEXITCODE -ne 0) { throw 'the installed current Web profile failed its live boot smoke test' }

          Write-Host "current profile installed, composed, booted, and served the plugin bundle: $($pack.filename)"
