name: Bug report
description: Report a bug or a suspected false positive in dsh-failure-lens.
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. `dsh-failure-lens` is a read-only, deterministic Web client plugin.
        A false-positive or wrong-explanation report is most useful with evidence.
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What happened
      options:
        - The warning row appeared when it should not have (false positive)
        - A real `spawn EPERM` was NOT explained (false negative)
        - The row layout or copy is wrong
        - Build / install / typecheck failure
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Description
      description: What you saw and what you expected.
    validations:
      required: true
  - type: textarea
    id: evidence-summary
    attributes:
      label: Privacy-trimmed evidence summary
      description: |
        Do not attach a complete session export. Report only whether the four signature markers,
        `isError`, and a non-zero exit code were present. Remove commands, arguments, paths,
        credentials, source text, and unrelated output.
      placeholder: |
        Error: spawn EPERM: present
        code EPERM: present
        syscall spawn: present
        node:internal/child_process: present
        isError: false
        exit code: 1
    validations:
      required: true
  - type: textarea
    id: minimal-snippet
    attributes:
      label: Minimal redacted snippet (optional)
      description: |
        Paste only the few lines needed to show a classifier mistake. Replace private values with
        placeholders. A maintainer will request a private follow-up if more evidence is necessary.
      render: text
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands or steps, as concrete as possible.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Node version (`node --version`), Harness version, and whether the sandbox was active.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not attach a complete session export or Harness home.
          required: true
        - label: I removed credentials, private code, commands, arguments, identifying paths, and unrelated output.
          required: true
        - label: I understand that this is a public GitHub issue.
          required: true
